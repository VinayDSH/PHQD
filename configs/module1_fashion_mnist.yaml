dataset:
  name: FashionMNIST
  image_size: 28
  channels: 1
  normalize_min: 0.0
  normalize_max: 1.0

autoencoder:
  latent_channels: 4
  latent_height: 8
  latent_width: 8
  reconstruction_loss: mse

training:
  seed: 42
  batch_size: 128
  epochs: 30
  learning_rate: 0.001

patches:
  patch_size: 4
  stride: 2

evaluation:
  metrics:
    - psnr
    - ssim
